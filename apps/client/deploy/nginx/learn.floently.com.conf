server {
    listen 80;
    server_name learn.floently.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name learn.floently.com;

    ssl_certificate /etc/letsencrypt/live/learn.floently.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn.floently.com/privkey.pem;

    root /var/www/learn.floently.com/current;
    index index.html;

    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
