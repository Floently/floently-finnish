name: Build 47 UAT web export

on:
  pull_request:
    paths:
      - '.github/workflows/build47-uat-web-export.yml'
      - 'docs/agents/BUILD47_PROGRESSIVE_LEARNING_UAT_20260927.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE_CANDIDATE="661f3d298c90f8e0c9971dce9a99cb73e721644d"
          git merge-base --is-ancestor "$BASE_CANDIDATE" HEAD
          echo "BUILD47_SOURCE_CANDIDATE_ANCESTRY=PASS"

      - name: Pin pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.34.0'
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --dir apps/client exec tsc --noEmit

      - name: Verify combined Build 47 source candidate
        run: pnpm --dir apps/client run verify:build47-source-candidate

      - name: Load production-compatible Expo public environment
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('apps/client/eas.json', 'utf8'));
          const env = eas?.build?.production?.env ?? {};
          for (const [key, value] of Object.entries(env)) {
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}<<__ENV__\n${String(value)}\n__ENV__\n`);
          }
          NODE

      - name: Export exact web UAT artifact
        shell: bash
        run: |
          set -euo pipefail
          cd apps/client
          rm -rf /tmp/kielivalmis-build47-uat-web
          pnpm exec expo export --platform web --output-dir /tmp/kielivalmis-build47-uat-web --clear
          test -f /tmp/kielivalmis-build47-uat-web/index.html
          {
            echo "KieliValmis Build 47 UAT web artifact"
            echo "workflow_head_sha=$GITHUB_SHA"
            echo "runtime_candidate_sha=661f3d298c90f8e0c9971dce9a99cb73e721644d"
            echo "branch=$GITHUB_HEAD_REF"
            echo "production_actions=none"
          } > /tmp/kielivalmis-build47-uat-web/BUILD47_UAT_SOURCE.txt
          echo "WEB_UAT_EXPORT=PASS"

      - name: Upload exact UAT artifact
        uses: actions/upload-artifact@v4
        with:
          name: kielivalmis-build47-uat-web-${{ github.sha }}
          path: /tmp/kielivalmis-build47-uat-web
          if-no-files-found: error
          retention-days: 7
