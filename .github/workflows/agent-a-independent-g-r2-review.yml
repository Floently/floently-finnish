name: Agent A independent G r2 review

on:
  push:
    branches:
      - agent/a-review-g-r2-20260817

jobs:
  verify-agent-g:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: "10.34.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm --dir apps/client exec tsc --noEmit
      - name: Run Agent G verifier
        run: node apps/client/scripts/verify-learning-experience-system.mjs
