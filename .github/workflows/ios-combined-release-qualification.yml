name: iOS combined release qualification

on:
  pull_request:
    branches:
      - integration/canonical-production-20260816
  workflow_dispatch:

jobs:
  release-qualification:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: apps/backend
      FLOENTLY_ENV: development
      SIGNED_SESSION_SECRET: ios-release-qualification-secret
      OPENAI_EVALUATION_ENABLED: "0"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prove canonical release ancestry
        run: |
          git fetch --no-tags --depth=256 origin integration/canonical-production-20260816
          git merge-base --is-ancestor origin/integration/canonical-production-20260816 HEAD
          echo "PRODUCTION_ANCESTRY_GATE=PASS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt

      - name: Verify deployable backend boundary
        run: |
          grep -F 'COPY apps/backend/ .' apps/backend/Dockerfile
          if grep -Eq 'COPY[[:space:]]+engine(/|[[:space:]])' apps/backend/Dockerfile; then
            echo 'Root engine unexpectedly entered the deployable backend image.' >&2
            exit 1
          fi
          echo "DEPLOYABLE_BACKEND_SCOPE=apps/backend"

      - name: Run complete deployable backend suite
        run: python -m pytest apps/backend/tests -q

      - name: Verify Roleplay backend invariants
        env:
          STATE_STORE_PATH: /tmp/kielivalmis-ios-release-roleplay-state.json
        run: |
          python -m py_compile \
            apps/backend/app/routers/v1_roleplay.py \
            apps/backend/app/runtime/roleplay.py \
            apps/backend/app/services/roleplay_ownership.py \
            apps/backend/app/services/roleplay_session_service.py \
            apps/backend/app/services/roleplay_ai_service.py \
            apps/backend/scripts/verify_roleplay_session_ownership.py \
            apps/backend/scripts/verify_roleplay_role_contract_reliability.py \
            apps/backend/scripts/verify_roleplay_ai_evaluation.py \
            apps/backend/scripts/verify_roleplay_mission_bank.py \
            apps/backend/scripts/verify_voice_registry.py
          python apps/backend/scripts/verify_roleplay_session_ownership.py
          python apps/backend/scripts/verify_roleplay_role_contract_reliability.py
          python apps/backend/scripts/verify_roleplay_ai_evaluation.py
          (cd apps/backend && python scripts/verify_roleplay_mission_bank.py)
          python apps/backend/scripts/verify_voice_registry.py

      - name: Verify YKI backend invariants
        run: |
          python apps/backend/scripts/verify_yki_ai_evaluation.py
          python apps/backend/scripts/verify_yki_evaluation_regression_recovery.py
          python apps/backend/scripts/verify_yki_final_submit_recovery.py
          python apps/backend/scripts/verify_yki_local_fallback_evaluation.py
          python apps/backend/scripts/verify_yki_report_calibration.py

      - name: Pin pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.34.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Whole client TypeScript
        run: pnpm --dir apps/client exec tsc --noEmit

      - name: Verify App Review remediation invariants
        run: |
          pnpm --dir apps/client run verify:navigation
          pnpm --dir apps/client run verify:account-deletion-access
          pnpm --dir apps/client run verify:revenuecat-identity
          pnpm --dir apps/client run verify:store-billing-preflight
          pnpm --dir apps/client run verify:ios-release-identity

      - name: Verify Reading Writing Practice and learning experience
        run: |
          node --disable-warning=ExperimentalWarning apps/client/scripts/verify-reading-engine.mjs
          node apps/client/scripts/verify-agent-d-writing.mjs
          node apps/client/scripts/verify-agent-d-writing-profession.mjs
          node --experimental-strip-types apps/client/scripts/verify-practice-composer.mts
          node apps/client/scripts/verify-learning-experience-system.mjs
          node apps/client/scripts/verify-wave1-professional-mission-integration.mjs
          node --experimental-strip-types apps/client/scripts/verify-wave1-product-wiring.mts

      - name: Verify navigation Roleplay audio and scenario invariants
        run: |
          node apps/client/scripts/verify-navigation-invariants.mjs
          node apps/client/scripts/verify-roleplay-audio-invariants.mjs
          node apps/client/scripts/verify-roleplay-scenario-rotation.mjs

      - name: Verify YKI client invariants
        run: |
          node apps/client/scripts/verify-yki-evaluation-integration.mjs
          node apps/client/scripts/verify-yki-final-submit-recovery.mjs
          node apps/client/scripts/verify-yki-local-fallback-contract.mjs
          node apps/client/scripts/verify-yki-multivoice-contract.mjs
          node apps/client/scripts/verify-yki-report-calibration.mjs
          node apps/client/scripts/verify-yki-report-hardening.mjs
          node apps/client/scripts/verify-yki-session-handoff.mjs
          node apps/client/scripts/verify-yki-speaking-timer-autosave.mjs

      - name: Verify governance brand and localization structure
        run: |
          node apps/client/scripts/verify-wave1-agent-governance.mjs
          node apps/client/scripts/check-i18n-completeness.mjs
          node apps/client/scripts/audit-kielivalmis-visible-brand.mjs
          (cd apps/client && node scripts/verify-kielivalmis-rebrand.mjs)

      - name: Release source qualification complete
        run: |
          echo "PROTECTED_INVARIANT_GATES=PASS"
          echo "APP_REVIEW_REMEDIATION_SOURCE=PASS"
          echo "WAVE1_RELEASE_SOURCE=PASS"
          echo "IOS_COMBINED_RELEASE_QUALIFICATION=PASS"
