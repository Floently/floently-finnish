name: Agent A Wave 1 B+C integration QA

on:
  push:
    branches:
      - agent/a-integration-bc-qa-20260817

jobs:
  verify-bc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt
      - name: Run Agent B targeted tests
        env:
          PYTHONPATH: apps/backend
          FLOENTLY_ENV: development
          SIGNED_SESSION_SECRET: agent-a-integration-secret
        run: |
          python -m pytest -q \
            apps/backend/tests/test_learning_platform_events.py \
            apps/backend/tests/test_learning_platform_capabilities.py \
            apps/backend/tests/test_learning_platform_fixtures.py
      - uses: pnpm/action-setup@v6
        with:
          version: "10.34.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm --dir apps/client exec tsc --noEmit
      - name: Run Agent C verifier
        run: node --disable-warning=ExperimentalWarning apps/client/scripts/verify-reading-engine.mjs
