server {
    listen 80;
    server_name learn-api.floently.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name learn-api.floently.com;

    # Replace with real cert paths (Let's Encrypt or your CA)
    ssl_certificate /etc/letsencrypt/live/learn-api.floently.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learn-api.floently.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }
}
