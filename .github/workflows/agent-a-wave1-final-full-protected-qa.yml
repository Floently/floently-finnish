# QA instrumentation only. Reviewed runtime source remains ddef94695001656b44d51f7469cd1ea4f5029232.
# Observable PR trigger; no runtime source change.
name: Agent A Wave 1 final full protected QA

on:
  push:
    branches:
      - agent/a-wave1-final-full-protected-qa-base-20260818
  pull_request:
    branches:
      - agent/a-wave1-final-full-protected-qa-base-20260818

jobs:
  protected-invariants:
    runs-on: ubuntu-latest
    env:
      WAVE1_RUNTIME_SHA: ddef94695001656b44d51f7469cd1ea4f5029232
      AGENT_F_ACCEPTED_SHA: 6e275d1dd04e4f6a0bd2c0a5981f7e63121cf272
      QA_WORKFLOW_PATH: .github/workflows/agent-a-wave1-final-full-protected-qa.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch exact provenance commits without full repository history
        run: |
          git fetch --no-tags --depth=2 origin agent/a-wave1-final-full-protected-qa-base-20260818
          test "$(git rev-parse FETCH_HEAD^)" = "$WAVE1_RUNTIME_SHA"
          git fetch --no-tags --depth=1 origin agent/f-professional-missions-20260816
          test "$(git rev-parse FETCH_HEAD)" = "$AGENT_F_ACCEPTED_SHA"

      - name: Prove exact runtime source identity before QA
        run: |
          git diff --exit-code "$WAVE1_RUNTIME_SHA" HEAD -- . ":(exclude)$QA_WORKFLOW_PATH"
          test "$(git diff --name-only "$WAVE1_RUNTIME_SHA" HEAD | grep -v "^$QA_WORKFLOW_PATH$" | wc -l)" -eq 0
          echo "WAVE1_RUNTIME_SHA=$WAVE1_RUNTIME_SHA"
          echo "QA_INSTRUMENTATION_ONLY=PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/backend/requirements.txt

      - name: Learning auth Cards Roleplay voice YKI and mission backend regressions
        env:
          PYTHONPATH: apps/backend
          FLOENTLY_ENV: development
          SIGNED_SESSION_SECRET: agent-a-final-wave1-protected-secret
        run: |
          python -m pytest -q \
            apps/backend/tests/test_learning_platform_events.py \
            apps/backend/tests/test_learning_platform_capabilities.py \
            apps/backend/tests/test_learning_platform_fixtures.py \
            apps/backend/tests/test_auth_persistence.py \
            apps/backend/tests/test_google_oauth_native.py \
            apps/backend/tests/test_cards_logic_answer_options.py \
            apps/backend/tests/test_roleplay_role_contract_regressions.py \
            apps/backend/tests/test_voice_service_failure_classification.py \
            apps/backend/tests/test_professional_mission_contract.py \
            apps/backend/tests/test_yki_local_fallback.py \
            apps/backend/tests/test_yki_orchestrator.py \
            apps/backend/tests/test_yki_state_machine.py

      - name: Protected Roleplay ownership contract evaluation mission and voice invariants
        env:
          PYTHONPATH: apps/backend
          STATE_STORE_PATH: /tmp/floently-final-wave1-roleplay-state.json
        run: |
          python -m py_compile \
            apps/backend/app/routers/v1_roleplay.py \
            apps/backend/app/runtime/roleplay.py \
            apps/backend/app/services/roleplay_ownership.py \
            apps/backend/app/services/roleplay_session_service.py \
            apps/backend/app/services/roleplay_ai_service.py \
            apps/backend/scripts/verify_roleplay_session_ownership.py \
            apps/backend/scripts/verify_roleplay_role_contract_reliability.py \
            apps/backend/scripts/verify_roleplay_ai_evaluation.py \
            apps/backend/scripts/verify_roleplay_mission_bank.py \
            apps/backend/scripts/verify_voice_registry.py
          python apps/backend/scripts/verify_roleplay_session_ownership.py
          python apps/backend/scripts/verify_roleplay_role_contract_reliability.py
          python apps/backend/scripts/verify_roleplay_ai_evaluation.py
          (cd apps/backend && python scripts/verify_roleplay_mission_bank.py)
          python apps/backend/scripts/verify_voice_registry.py

      - uses: pnpm/action-setup@v6
        with:
          version: "10.34.0"
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Whole client TypeScript
        run: pnpm --dir apps/client exec tsc --noEmit

      - name: Reading Writing Practice Professional Missions graphics accessibility and wiring
        run: |
          node --disable-warning=ExperimentalWarning apps/client/scripts/verify-reading-engine.mjs
          node apps/client/scripts/verify-agent-d-writing.mjs
          node apps/client/scripts/verify-agent-d-writing-profession.mjs
          node --experimental-strip-types apps/client/scripts/verify-practice-composer.mts
          node apps/client/scripts/verify-professional-missions.mjs
          node apps/client/scripts/verify-learning-experience-system.mjs
          node apps/client/scripts/verify-wave1-professional-mission-integration.mjs
          node --experimental-strip-types apps/client/scripts/verify-wave1-integration-seams.mts
          node --experimental-strip-types apps/client/scripts/verify-wave1-product-wiring.mts

      - name: Accepted Agent F mission source identity and isolated verifier
        run: |
          test "$(git rev-parse $AGENT_F_ACCEPTED_SHA)" = "$AGENT_F_ACCEPTED_SHA"
          git diff --exit-code "$AGENT_F_ACCEPTED_SHA" HEAD -- \
            packages/core/professional/missions.mjs \
            packages/core/professional/missions.d.ts \
            apps/client/scripts/verify-professional-missions.mjs \
            apps/backend/tests/test_professional_mission_contract.py \
            docs/agents/research/AGENT_F_RESEARCH.md
          git worktree add --detach /tmp/agent-f-final-source "$AGENT_F_ACCEPTED_SHA"
          (cd /tmp/agent-f-final-source && node apps/client/scripts/verify-professional-missions.mjs)

      - name: Navigation deep links Roleplay audio STT transport and scenario invariants
        run: |
          node apps/client/scripts/verify-navigation-invariants.mjs
          node apps/client/scripts/verify-roleplay-audio-invariants.mjs
          node apps/client/scripts/verify-roleplay-scenario-rotation.mjs

      - name: YKI practice mock full-exam and recovery client invariants
        run: |
          node apps/client/scripts/verify-yki-evaluation-integration.mjs
          node apps/client/scripts/verify-yki-final-submit-recovery.mjs
          node apps/client/scripts/verify-yki-local-fallback-contract.mjs
          node apps/client/scripts/verify-yki-multivoice-contract.mjs
          node apps/client/scripts/verify-yki-report-calibration.mjs
          node apps/client/scripts/verify-yki-report-hardening.mjs
          node apps/client/scripts/verify-yki-session-handoff.mjs
          node apps/client/scripts/verify-yki-speaking-timer-autosave.mjs

      - name: Brand language catalog and localization structural guards
        run: |
          node apps/client/scripts/check-i18n-completeness.mjs
          node apps/client/scripts/audit-kielivalmis-visible-brand.mjs
          (cd apps/client && node scripts/verify-kielivalmis-rebrand.mjs)

      - name: Hardcoded UI text report
        if: always()
        run: |
          node apps/client/scripts/audit-i18n-hardcoded.mjs | tee /tmp/wave1-final-i18n-audit.txt
          echo '--- Wave 1 touched surfaces ---'
          grep -E 'AppShell.tsx|ProfessionalRoute.tsx|LearningRoute.tsx|IntegratedPracticeRoute.tsx|ReadingRuntimeScreen.tsx|WritingPracticeScreen.tsx|WritingRouteScreen.tsx|speaking/mission.tsx' /tmp/wave1-final-i18n-audit.txt || true

      - name: Re-prove runtime identity after all protected gates
        if: always()
        run: |
          git diff --exit-code "$WAVE1_RUNTIME_SHA" HEAD -- . ":(exclude)$QA_WORKFLOW_PATH"
          test "$(git diff --name-only "$WAVE1_RUNTIME_SHA" HEAD | grep -v "^$QA_WORKFLOW_PATH$" | wc -l)" -eq 0
          echo "WAVE1_EXACT_SOURCE_IDENTITY=PASS"
