name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r apps/backend/requirements.txt
      - name: Verify material convergence
        run: |
          cd apps/backend
          python - <<'CHECK'
          from app.runtime.cards_material_bank import load_authority_cards, load_runtime_bank

          authority_cards = load_authority_cards()
          runtime_cards = load_runtime_bank()

          print("authority_cards", len(authority_cards))
          print("runtime_cards", len(runtime_cards))

          if not authority_cards:
              raise SystemExit("No authority cards loaded from apps/backend/card_bank")

          if len(authority_cards) != len(runtime_cards):
              raise SystemExit("Authority/runtime card count mismatch")
          CHECK
      - name: Verify release backend boundary
        run: |
          grep -F 'COPY apps/backend/ .' apps/backend/Dockerfile
          if grep -Eq 'COPY[[:space:]]+engine(/|[[:space:]])' apps/backend/Dockerfile; then
            echo 'Root engine unexpectedly entered the deployable backend image.' >&2
            exit 1
          fi
          echo 'DEPLOYABLE_BACKEND_SCOPE=apps/backend'
      - name: Verify account deletion completion truth
        run: python -m pytest apps/backend/tests/test_account_deletion_service.py -q
        env:
          PYTHONPATH: apps/backend
          FLOENTLY_ENV: development
          SIGNED_SESSION_SECRET: ci-test-secret
      # The shipped backend image copies apps/backend only. Root engine/tests is a
      # separate legacy/provenance tree with imports for untracked engine.learning,
      # engine.logging and engine.blueprints modules, so it is not a release-runtime
      # gate. This job tests the complete deployable backend test suite instead.
      - name: Run deployable backend tests
        run: python -m pytest apps/backend/tests -q
        env:
          PYTHONPATH: apps/backend
          FLOENTLY_ENV: development
          SIGNED_SESSION_SECRET: ci-test-secret

  ios-native-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/build-48-native-read-release-20260929'
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.34.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify document media-session source patch
        run: pnpm --dir apps/client run verify:read-media-session
      - name: Generate exact native iOS project
        working-directory: apps/client
        run: pnpm exec expo prebuild --platform ios --clean --no-install
      - name: Verify expo-audio was patched by prebuild
        run: |
          grep -F "FLOENTLY_LOGICAL_NOW_PLAYING_V1" node_modules/expo-audio/ios/AudioPlayer.swift
          grep -F "logicalSeekRequested" node_modules/expo-audio/ios/AudioPlayer.swift
          grep -F "MPMediaItemPropertyPlaybackDuration] = logical.duration" node_modules/expo-audio/ios/MediaController.swift
          grep -F "player.requestLogicalSeek(to: event.positionTime)" node_modules/expo-audio/ios/MediaController.swift
          echo "IOS_LOGICAL_MEDIA_PATCH_APPLIED=PASS"
      - name: Install iOS pods
        working-directory: apps/client/ios
        run: pod install
      - name: Compile generated iOS simulator app
        working-directory: apps/client
        run: |
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -workspace "$workspace" -list -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["workspace"]["schemes"][0])')"
          test -n "$scheme"
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/floently-read-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.34.0'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm --dir apps/client exec tsc --noEmit

      - name: Verify iOS build freeze contract
        run: |
          test -f .github/workflows/ios-testflight-release.yml
          test -f apps/client/.eas/workflows/ios-testflight-release.yml
          for workflow in \
            .github/workflows/ios-testflight-release.yml \
            apps/client/.eas/workflows/ios-testflight-release.yml
          do
            if grep -Eq '^[[:space:]]*push:' "$workflow"; then
              echo "$workflow must never auto-trigger from push while monthly builds are constrained." >&2
              exit 1
            fi
            grep -F "workflow_dispatch:" "$workflow"
            grep -F "product_owner_approval:" "$workflow"
            grep -F "known_blockers:" "$workflow"
            grep -F "APPROVE_IOS_BUILD" "$workflow"
            grep -F "ZERO_KNOWN_BLOCKERS" "$workflow"
          done
          grep -F "inputs.product_owner_approval == 'APPROVE_IOS_BUILD'" apps/client/.eas/workflows/ios-testflight-release.yml
          grep -F "inputs.known_blockers == 'ZERO_KNOWN_BLOCKERS'" apps/client/.eas/workflows/ios-testflight-release.yml
          echo "IOS_BUILD_FREEZE_CONTRACT=PASS"

      - name: Verify EAS release workflow source contracts
        run: |
          test -f apps/client/.eas/workflows/ios-testflight-release.yml
          test -f apps/client/.eas/workflows/production-ota.yml
          grep -F "type: build" apps/client/.eas/workflows/ios-testflight-release.yml
          grep -F "platform: ios" apps/client/.eas/workflows/ios-testflight-release.yml
          grep -F "type: submit" apps/client/.eas/workflows/ios-testflight-release.yml
          grep -F "type: update" apps/client/.eas/workflows/production-ota.yml
          grep -F "channel: production" apps/client/.eas/workflows/production-ota.yml
          echo "EAS_WORKFLOW_SOURCE_CONTRACTS=PASS"
      - name: Verify subscription authority invariants
        run: pnpm --dir apps/client run verify:subscription-authority
      - name: Verify native Read product invariants
        run: |
          grep -F "ReadHomeScreen" apps/client/app/read/app.tsx
          grep -F "ReadReaderScreen" apps/client/app/read/reader.tsx
          if grep -Fq "ReadWebWorkspaceScreen" apps/client/app/read/app.tsx apps/client/app/read/reader.tsx; then
            echo "Main Read product must remain React Native, not a WebView workspace." >&2
            exit 1
          fi
          if grep -Fq "/app/reader?embed=react-native" apps/client/features/read/mobile/ReadLiveBrowserScreen.tsx; then
            echo "Read Browser must not host the main Reader workspace." >&2
            exit 1
          fi
          grep -F "ReadDeviceBrowserScreen" apps/client/app/read/browser.tsx
          if grep -Fq "ReadLiveBrowserScreen" apps/client/app/read/browser.tsx; then
            echo "Native Read Browser must not route through remote Browser V2." >&2
            exit 1
          fi
          grep -F "source={{ uri: currentUrl }}" apps/client/features/read/mobile/ReadDeviceBrowserScreen.tsx
          grep -F "sharedCookiesEnabled" apps/client/features/read/mobile/ReadDeviceBrowserScreen.tsx
          grep -F "onContentProcessDidTerminate" apps/client/features/read/mobile/ReadDeviceBrowserScreen.tsx
          grep -F "onRenderProcessGone" apps/client/features/read/mobile/ReadDeviceBrowserScreen.tsx
          grep -F "createReadingPlaybackManifest" apps/client/features/read/mobile/ReadMobileScreens.tsx
          grep -F "readingProgressForSegment" apps/client/features/read/mobile/ReadMobileScreens.tsx
          grep -F "navigate('/read/browser')" apps/client/features/read/mobile/ReadMobileScreens.tsx
          pnpm --dir apps/client run verify:read-live-browser
          pnpm --dir apps/client run verify:read-media-session
          echo "READ_NATIVE_PRODUCT_INVARIANTS=PASS"
      - name: Lint subscription authority hotfix
        run: pnpm --dir apps/client exec eslint state/subscriptionStore.ts scripts/verify-subscription-authority.mjs
      - name: Load production Expo public environment
        run: |
          node <<'NODE'
          const fs = require('fs');
          const eas = JSON.parse(fs.readFileSync('apps/client/eas.json', 'utf8'));
          const env = eas?.build?.production?.env ?? {};
          for (const [key, value] of Object.entries(env)) {
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}<<__ENV__\n${String(value)}\n__ENV__\n`);
          }
          NODE
      - name: Verify native audio OTA runtime identity
        run: |
          cd apps/client
          pnpm exec expo config --type public --json > /tmp/kielivalmis-config.json
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/kielivalmis-config.json', 'utf8'));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(config.name === 'KieliValmis', `Unexpected app name: ${config.name}`);
          assert(config.ios?.bundleIdentifier === 'com.vitusidi.floently', `Unexpected bundle ID: ${config.ios?.bundleIdentifier}`);
          assert(config.runtimeVersion === '1.0.4', `Unexpected root runtimeVersion: ${config.runtimeVersion}`);
          assert(config.ios?.runtimeVersion === '1.0.5', `Unexpected iOS runtimeVersion: ${config.ios?.runtimeVersion}`);
          assert(config.android?.runtimeVersion === '1.0.4', `Unexpected Android runtimeVersion: ${config.android?.runtimeVersion}`);
          assert(config.updates?.enabled === true, 'Expo Updates is not enabled');
          assert(
            config.updates?.url === 'https://u.expo.dev/fa02c141-0a3b-4dbc-9122-7c1cf31ba42c',
            `Unexpected update URL: ${config.updates?.url}`,
          );
          assert(config.updates?.checkAutomatically === 'ON_LOAD', `Unexpected update policy: ${config.updates?.checkAutomatically}`);
          console.log('NATIVE_AUDIO_OTA_RUNTIME_IDENTITY=PASS');
          NODE
      - name: Export iOS OTA bundle
        run: |
          cd apps/client
          pnpm exec expo export --platform ios --output-dir /tmp/kielivalmis-build47-authority-export --clear
          test -n "$(find /tmp/kielivalmis-build47-authority-export -type f -print -quit)"
          echo "IOS_OTA_EXPORT=PASS"
      - name: Verify navigation invariants
        run: pnpm --dir apps/client run verify:navigation
      - name: Verify account deletion access invariants
        run: pnpm --dir apps/client run verify:account-deletion-access
      - name: Verify RevenueCat identity invariants
        run: pnpm --dir apps/client run verify:revenuecat-identity
      - name: Verify store billing preflight invariants
        run: pnpm --dir apps/client run verify:store-billing-preflight
      - name: Verify iOS release identity invariants
        run: pnpm --dir apps/client run verify:ios-release-identity
