name: reader-stabilization-crosscheck

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flowreader-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out app candidate
        uses: actions/checkout@v4

      - name: Check out Browser Reader candidate
        uses: actions/checkout@v4
        with:
          repository: Floently/flowreader
          ref: agent/browser-reader-controller-continuity-20260929
          path: flowreader

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: flowreader/frontend/package-lock.json

      - name: Install Browser Reader dependencies
        working-directory: flowreader/frontend
        run: npm ci

      - name: Browser Reader TypeScript and production build
        working-directory: flowreader/frontend
        run: npm run build
