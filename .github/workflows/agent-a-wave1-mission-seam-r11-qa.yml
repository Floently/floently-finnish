name: Agent A Wave 1 mission seam r11 QA

on:
  push:
    branches:
      - agent/a-wave1-mission-seam-r11-qa-20260817

jobs:
  mission-seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: "10.34.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Whole client TypeScript
        run: pnpm --dir apps/client exec tsc --noEmit
      - name: Accepted feature regressions
        run: |
          node --disable-warning=ExperimentalWarning apps/client/scripts/verify-reading-engine.mjs
          node apps/client/scripts/verify-agent-d-writing.mjs
          node apps/client/scripts/verify-agent-d-writing-profession.mjs
          node --experimental-strip-types apps/client/scripts/verify-practice-composer.mts
          node apps/client/scripts/verify-professional-missions.mjs
          node apps/client/scripts/verify-learning-experience-system.mjs
      - name: Professional Mission integration seam
        run: node apps/client/scripts/verify-wave1-professional-mission-integration.mjs
      - name: Cross-agent and product wiring
        run: |
          node --experimental-strip-types apps/client/scripts/verify-wave1-integration-seams.mts
          node --experimental-strip-types apps/client/scripts/verify-wave1-product-wiring.mts
      - name: Navigation and Roleplay invariants
        run: |
          node apps/client/scripts/verify-navigation-invariants.mjs
          node apps/client/scripts/verify-roleplay-audio-invariants.mjs
          node apps/client/scripts/verify-roleplay-scenario-rotation.mjs
