name: Floently production OTA

on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        required: true
        description: OTA release message
        default: Floently production update

jobs:
  publish_update:
    name: Publish production OTA
    type: update
    environment: production
    params:
      channel: production
      platform: all
      message: ${{ inputs.message }}
