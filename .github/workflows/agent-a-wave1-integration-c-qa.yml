name: Agent A Wave 1 integration C QA

on:
  push:
    branches:
      - agent/a-wave1-integration-c-qa-20260817

jobs:
  verify-agent-c-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: "10.34.0"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm --dir apps/client exec tsc --noEmit
      - name: Run Agent C verifier on combined B+C tree
        run: node --disable-warning=ExperimentalWarning apps/client/scripts/verify-reading-engine.mjs
