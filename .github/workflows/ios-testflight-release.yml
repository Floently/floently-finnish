name: iOS TestFlight release candidate

on:
  push:
    branches:
      - agent/build-48-native-read-release-20260929
    paths:
      - .github/workflows/ios-testflight-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight-release-candidate
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "10.34.0"
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Missing GitHub Actions secret EXPO_TOKEN." >&2
            exit 1
          fi
          npx --yes eas-cli@latest whoami

      - name: TypeScript release check
        run: pnpm --dir apps/client exec tsc --noEmit

      - name: Verify native Read architecture
        run: |
          grep -F "ReadHomeScreen" apps/client/app/read/app.tsx
          grep -F "ReadReaderScreen" apps/client/app/read/reader.tsx
          if grep -Fq "ReadWebWorkspaceScreen" apps/client/app/read/app.tsx apps/client/app/read/reader.tsx; then
            echo "Floently Read must remain native React Native." >&2
            exit 1
          fi
          if grep -Fq "/app/reader?embed=react-native" apps/client/features/read/mobile/ReadLiveBrowserScreen.tsx; then
            echo "Browser Reader must not host the main Reader workspace." >&2
            exit 1
          fi
          grep -F "createReadingPlaybackManifest" apps/client/features/read/mobile/ReadMobileScreens.tsx
          grep -F "seekDocumentBySeconds" apps/client/features/read/mobile/ReadMobileScreens.tsx
          pnpm --dir apps/client run verify:read-live-browser
          echo "NATIVE_READ_RELEASE_GATE=PASS"

      - name: Verify release and billing invariants
        run: |
          pnpm --dir apps/client run verify:subscription-authority
          pnpm --dir apps/client run verify:navigation
          pnpm --dir apps/client run verify:account-deletion-access
          pnpm --dir apps/client run verify:revenuecat-identity
          pnpm --dir apps/client run verify:store-billing-preflight
          pnpm --dir apps/client run verify:ios-release-identity

      - name: Verify OTA configuration in release binary
        working-directory: apps/client
        run: |
          pnpm exec expo config --type public --json > /tmp/floently-expo-config.json
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('/tmp/floently-expo-config.json', 'utf8'));
          const assert = (ok, msg) => { if (!ok) throw new Error(msg); };
          assert(config.ios?.bundleIdentifier === 'com.vitusidi.floently', 'Unexpected iOS bundle identifier');
          assert(config.runtimeVersion === '1.0.4', `Unexpected runtimeVersion: ${config.runtimeVersion}`);
          assert(config.updates?.enabled === true, 'Expo Updates must be enabled');
          assert(config.updates?.url === 'https://u.expo.dev/fa02c141-0a3b-4dbc-9122-7c1cf31ba42c', 'Unexpected Expo Updates URL');
          assert(config.updates?.checkAutomatically === 'ON_LOAD', 'OTA must check on app load');
          console.log('IOS_RELEASE_OTA_CONFIG=PASS');
          NODE

      - name: Queue build and auto-submit to TestFlight
        working-directory: apps/client
        run: >
          npx --yes eas-cli@latest build
          --platform ios
          --profile production
          --non-interactive
          --auto-submit-with-profile production
          --no-wait
